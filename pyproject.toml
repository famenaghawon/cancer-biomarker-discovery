[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cancer-biomarkers"
version = "0.3.0"
description = "End-to-end computational platform for cancer biomarker discovery (synthetic, educational)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Famenaghawon Freedom", email = "f.e.amenaghawon@gmail.com" }]
dependencies = [
    "pandas>=2.1,<3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "joblib>=1.3.0",
    "pyarrow>=14.0.0",
    "lifelines>=0.27.0",
]
[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "ruff>=0.1.0"]
dashboard = ["streamlit>=1.40.0", "plotly>=5.18.0"]
docs = ["mkdocs>=1.5.0,<2.0", "mkdocs-material>=9.4.0,<10.0", "pymdown-extensions>=10.0", "mkdocstrings[python]>=0.24.0"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -W ignore::PendingDeprecationWarning"
filterwarnings = [
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
